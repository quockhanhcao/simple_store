version: "2"
sql:
  - engine: "postgresql"
    queries: "./internal/database/queries"
    schema: "./internal/database/migrations"
    gen:
      go:
        package: "sqlcdb"
        out: "internal/database/sqlcdb"
        sql_package: "pgx/v5"
        emit_json_tags: false
        overrides:
          - db_type: "pg_catalog.numeric"
            go_type: "github.com/shopspring/decimal.Decimal"
