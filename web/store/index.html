<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Catalog - SimpleStore</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="/css/site.css" />
</head>
<body>
    <div id="navbar"></div>

    <main>
        <section class="hero-section py-5 mb-4">
            <div class="container position-relative">
                <h1 class="display-5 fw-bold"><i class="bi bi-grid me-2"></i>Product Catalog</h1>
                <p class="lead">Discover our amazing collection of products</p>
                <!-- A plain GET form, like the C# view: it reloads this page with ?search=… and drops categoryId. -->
                <form method="get" action="/" class="d-flex gap-2 mt-3">
                    <input type="text" name="search" id="search" class="form-control form-control-lg" placeholder="Search products..." style="max-width: 400px;" />
                    <button type="submit" class="btn btn-primary btn-lg"><i class="bi bi-search"></i></button>
                </form>
            </div>
        </section>
        <div class="container">
            <div class="row">
                <div class="col-lg-3 mb-4">
                    <div class="card shadow-sm">
                        <div class="card-header bg-primary text-white"><h6 class="mb-0 text-white"><i class="bi bi-funnel me-2"></i>Categories</h6></div>
                        <div class="list-group list-group-flush" id="categories">
                            <a href="/" class="list-group-item list-group-item-action" id="all-products">
                                <i class="bi bi-grid me-2"></i>All Products
                            </a>
                        </div>
                    </div>
                </div>
                <div class="col-lg-9" id="products"></div>
            </div>
        </div>
    </main>

    <div id="footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/js/catalog.js"></script>
</body>
</html>
